[package]
name = "solo-design"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "solo_design"
path = "src/lib.rs"

[[bin]]
name = "solo-design"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.40", features = ["derive"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
serde_yaml = "=0.9.34"
libc = "=0.2.174"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.20.0"
